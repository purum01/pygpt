
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.25.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.25.0/components/prism-python.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.25.0/themes/prism.min.css" rel="stylesheet" />

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }
    .tab-container {
        display: flex;
        flex-wrap: wrap;
    }
    .tabs {
        display: flex;
        width: 100%;
        background-color: #f1f1f1;
        border-bottom: 1px solid #ddd;
        justify-content: space-between;
    }
    .tabs button {
        background-color: inherit;
        border: none;
        padding: 15px;
        text-align: center;
        width: 10%;
        transition: 0.3s;
        font-size: 16px;
        cursor: pointer;
        border-right: 1px solid #ddd;
    }
    .tabs button:hover {
        background-color: #ddd;
    }
    .tabs button.active {
        background-color: #ccc;
    }
    .tab-content {
        flex: 1;
        padding: 20px;
        display: none;
        width: 100%;
    }
    .tab-content.active {
        display: block;
    }
    pre {
        background-color: #f5f5f5;
        padding: 10px;
        border-radius: 5px;
        white-space: pre-wrap;
    }
    .copy-btn {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: 5px;
        cursor: pointer;
    }
    .copy-btn:hover {
        background-color: #0056b3;
    }
</style>
</head>
<body>

<div class="tabs">
<button class="tablinks" onclick="openTab(event, 'tab1')">커맨드창 실행</button>
<button class="tablinks" onclick="openTab(event, 'tab2')">Jupyter Lab 실행 1</button>
<button class="tablinks" onclick="openTab(event, 'tab3')">Jupyter Lab 실행 2</button>
<button class="tablinks" onclick="openTab(event, 'tab4')">터미널창 열기</button>
<button class="tablinks" onclick="openTab(event, 'tab5')">스크립트 파일 생성</button>
</div>

<div class="tab-container">
    <div id="tab1" class="tab-content">
      Tap1
    </div>
    <div id="tab2" class="tab-content">
        Tap2
    </div>
    <div id="tab3" class="tab-content">
        Tap3
    </div>
    <div id="tab4" class="tab-content">
        Tap4
    </div>
    <div id="tab5" class="tab-content">
        Tap5
    </div>


</div>

<script>
function openTab(evt, tabName) {
    var i, tabcontent, tablinks;

    // 모든 탭 컨텐츠 숨기기
    tabcontent = document.getElementsByClassName("tab-content");
    for (i = 0; i < tabcontent.length; i++) {
        tabcontent[i].style.display = "none";
    }

    // 모든 탭 버튼에서 "active" 클래스 제거
    tablinks = document.getElementsByClassName("tablinks");
    for (i = 0; i < tablinks.length; i++) {
        tablinks[i].className = tablinks[i].className.replace(" active", "");
    }

    // 클릭한 탭 컨텐츠 표시 및 해당 탭 버튼에 "active" 클래스 추가
    document.getElementById(tabName).style.display = "block";
    evt.currentTarget.className += " active";
}


// 기본적으로 첫 번째 탭을 열어줍니다.
document.getElementsByClassName("tablinks")[0].click();
</script>
